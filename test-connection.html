<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .log { 
            background: #2a2a2a; 
            padding: 10px; 
            margin: 5px 0; 
            border-radius: 4px;
        }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .info { color: #2196f3; }
    </style>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <div id="logs"></div>
    
    <script type="module">
        import * as signalR from "https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/esm/index.min.js";
        
        const BACKEND_URL = "https://ohmyhungrygod-backend-f5che7gshshzhzhm.southafricanorth-01.azurewebsites.net/gamehub";
        const logs = document.getElementById('logs');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.appendChild(div);
            console.log(message);
        }
        
        log(`Testing connection to: ${BACKEND_URL}`, 'info');
        
        const connection = new signalR.HubConnectionBuilder()
            .withUrl(BACKEND_URL)
            .withAutomaticReconnect()
            .configureLogging(signalR.LogLevel.Debug)
            .build();
        
        connection.onreconnecting(() => log('Reconnecting...', 'info'));
        connection.onreconnected(() => log('Reconnected!', 'success'));
        connection.onclose(() => log('Connection closed', 'error'));
        
        try {
            log('Starting connection...', 'info');
            await connection.start();
            log('✅ Connected successfully!', 'success');
            
            log('Creating room...', 'info');
            const result = await connection.invoke("CreateRoom");
            log(`✅ Room created! ID: ${result.roomId}, Join Code: ${result.joinCode}`, 'success');
            
        } catch (error) {
            log(`❌ Error: ${error.message}`, 'error');
            log(`Full error: ${JSON.stringify(error)}`, 'error');
        }
    </script>
</body>
</html>
